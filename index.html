<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Contacten & winacties</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Overzicht">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root {
  color-scheme: light;
  --achtergrond: #f7f2ec;
  --kaart: #ffffff;
  --tekst: #2f2925;
  --zacht: #74685f;
  --lijn: #e7ddd2;
  --accent: #9a5641;
  --accent-donker: #7c4231;
  --accent-zacht: #f4e7e0;
  --invoer: #fffdfb;
  --berekend: #f1ece6;
  --fout: #a8322a;
  --ok: #2f7a45;
  --groen: #3b8a50;
  --geel: #f0c541;
  --oranje: #e5832b;
  --rood: #c23b30;
  --zwart: #1c1917;
  --radius: 12px;
  --schaduw: 0 1px 2px rgba(60, 40, 30, .06), 0 4px 14px rgba(60, 40, 30, .06);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--achtergrond); color: var(--tekst);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-donker); }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
.zacht { color: var(--zacht); }
.klein { font-size: .875rem; }
.verborgen { display: none !important; }

/* ---------- kop en navigatie ---------- */
.kop {
  position: sticky; top: 0; z-index: 20; background: var(--achtergrond);
  border-bottom: 1px solid var(--lijn);
}
.kop-binnen { max-width: 1280px; margin: 0 auto; padding: 12px 20px 0; }
.kop-rij { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.merk { font-weight: 650; font-size: 1.15rem; letter-spacing: .01em; color: var(--accent-donker); }
.merk small { display: block; font-weight: 400; font-size: .82rem; color: var(--zacht); }
.zoek { position: relative; flex: 1 1 320px; max-width: 520px; }
.zoek input {
  width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--lijn); border-radius: 999px; background: var(--kaart);
}
.zoek::before {
  content: ""; position: absolute; left: 14px; top: 50%; width: 13px; height: 13px; margin-top: -8px;
  border: 2px solid var(--zacht); border-radius: 50%;
}
.zoek::after {
  content: ""; position: absolute; left: 26px; top: 50%; width: 7px; height: 2px; margin-top: 5px;
  background: var(--zacht); transform: rotate(45deg);
}
.zoek-lijst {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--kaart); border: 1px solid var(--lijn);
  border-radius: var(--radius); box-shadow: var(--schaduw); overflow: hidden; z-index: 30;
}
.zoek-optie {
  display: block; width: 100%; text-align: left; padding: 10px 14px; border: 0; background: none; cursor: pointer;
  border-bottom: 1px solid var(--lijn);
}
.zoek-optie:last-child { border-bottom: 0; }
.zoek-optie:hover, .zoek-optie:focus { background: var(--accent-zacht); outline: none; }
.snelknoppen { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; white-space: nowrap; color: var(--zacht);
  border-bottom: 3px solid transparent; font-weight: 550;
}
.tab:hover { color: var(--tekst); }
.tab[aria-current="page"] { color: var(--accent-donker); border-bottom-color: var(--accent); }
.tab .teller { font-weight: 400; font-size: .8rem; background: var(--accent-zacht); color: var(--accent-donker); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }

main { max-width: 1280px; margin: 0 auto; padding: 20px 20px 80px; }
.paginakop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 14px; }
.paginakop h1 { font-size: 1.45rem; }
.paginakop .zacht { flex: 1 1 260px; }

/* ---------- knoppen ---------- */
.knop {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--lijn); background: var(--kaart); font-weight: 550; text-decoration: none; color: var(--tekst);
  white-space: nowrap;
}
.knop:hover { border-color: var(--accent); }
.knop:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .link:focus-visible {
  outline: 3px solid rgba(154, 86, 65, .35); outline-offset: 1px;
}
.knop.hoofd { background: var(--accent); border-color: var(--accent); color: #fff; }
.knop.hoofd:hover { background: var(--accent-donker); }
.knop.klein { padding: 5px 11px; font-size: .875rem; }
.knop.gevaar { color: var(--fout); }
.knop.ok { color: var(--ok); border-color: #b8d8c0; }
.knop .plus { font-size: 1.15em; line-height: 1; }
.link { background: none; border: 0; padding: 0; color: var(--accent-donker); text-decoration: underline; cursor: pointer; }
.knoppenrij { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- kaarten (vandaag) ---------- */
.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-items: start; }
.kaart { background: var(--kaart); border: 1px solid var(--lijn); border-radius: var(--radius); box-shadow: var(--schaduw); }
.kaart > header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.kaart > header h2 { font-size: 1.05rem; flex: 1; }
.kaart > header .aantal { font-size: .85rem; color: var(--zacht); }
.kaart .uitleg { padding: 0 16px 8px; margin: -4px 0 0; font-size: .875rem; color: var(--zacht); }
.item { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--lijn); }
.item-tekst { flex: 1 1 210px; min-width: 0; }
.item > .knoppenrij { flex: 0 1 auto; }
.item-tekst strong { font-weight: 600; }
.item-tekst .regel2 { font-size: .875rem; color: var(--zacht); }
.item .knoppenrij { justify-content: flex-end; }
.leeg { padding: 12px 16px 16px; color: var(--zacht); font-size: .925rem; border-top: 1px solid var(--lijn); }
.meer { padding: 10px 16px 14px; border-top: 1px solid var(--lijn); }
.te-laat { color: var(--fout); font-weight: 600; }

.melding-balk {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--radius);
  background: #fff6dc; border: 1px solid #ecd796; margin-bottom: 16px;
}
.melding-balk.fout { background: #fde8e6; border-color: #f0b8b2; }
.melding-balk p { margin: 0; flex: 1 1 300px; }

/* ---------- filters en tabellen ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.filters input[type="search"] { flex: 1 1 220px; max-width: 320px; }
.filters select, .filters input[type="search"], .veld input, .veld select, .veld textarea, table.aanmeldlijst select, table.aanmeldlijst input {
  padding: 8px 11px; border: 1px solid var(--lijn); border-radius: 9px; background: var(--invoer);
}
.filters label.vink { display: inline-flex; gap: 6px; align-items: center; font-size: .925rem; }
.kleurfilter { display: flex; flex-wrap: wrap; gap: 6px; }
.kleurfilter button { cursor: pointer; opacity: .55; }
.kleurfilter button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--kaart), 0 0 0 4px var(--accent); }
.kleurfilter.niets-gekozen button { opacity: 1; }
.segment { display: inline-flex; border: 1px solid var(--lijn); border-radius: 999px; background: var(--kaart); padding: 3px; flex-wrap: wrap; }
.segment button, .segment label { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 550; color: var(--zacht); }
.segment button[aria-pressed="true"], .segment input:checked + span { background: var(--accent); color: #fff; }
.segment label { padding: 0; }
.segment label span { display: block; padding: 6px 14px; border-radius: 999px; }
.segment input { position: absolute; opacity: 0; pointer-events: none; }
.segment input:focus-visible + span { outline: 3px solid rgba(154, 86, 65, .35); }
.telregel { font-size: .9rem; color: var(--zacht); margin: 0 0 8px; }

.tabel-wrap { background: var(--kaart); border: 1px solid var(--lijn); border-radius: var(--radius); overflow: auto; box-shadow: var(--schaduw); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--lijn); vertical-align: top; }
th { font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--zacht); font-weight: 600; background: #fbf8f4; position: sticky; top: 0; }
th button { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #fcf7f3; }
tbody tr:last-child td { border-bottom: 0; }
td .regel2 { font-size: .85rem; color: var(--zacht); }
td.getal, th.getal { text-align: right; font-variant-numeric: tabular-nums; }
.overzicht td, .overzicht th { text-align: center; white-space: nowrap; }
.overzicht td:first-child, .overzicht th:first-child { text-align: left; }
.overzicht tbody tr { cursor: default; }
.overzicht tfoot td { font-weight: 650; background: #fbf8f4; }
.overzicht .nul { color: var(--zacht); }
.overzicht .onbekend { color: #9a6b00; font-weight: 600; }
.overzicht .niet { color: var(--zacht); }

/* ---------- labels ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: .84rem;
  font-weight: 600; white-space: nowrap; border: 1px solid transparent; line-height: 1.5;
}
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
.chip.recent { background: #efe9e2; color: #5b4f46; }
.chip.groen { background: var(--groen); color: #fff; }
.chip.geel { background: var(--geel); color: #3b2f00; }
.chip.oranje { background: var(--oranje); color: #2b1600; }
.chip.rood { background: var(--rood); color: #fff; }
.chip.zwart { background: var(--zwart); color: #fff; }
.chip.onbekend { background: #fff; color: var(--zacht); border: 1px dashed #c8bcb0; }
.chip.groen::before, .chip.rood::before, .chip.zwart::before { background: rgba(255,255,255,.85); }
.chip.geel::before, .chip.oranje::before { background: rgba(0,0,0,.45); }
.chip.schatting { border-style: dashed; border-color: rgba(0,0,0,.35); }
.pil { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .82rem; font-weight: 600; background: #efe9e2; color: #5b4f46; white-space: nowrap; }
.pil.ja { background: #dcefe1; color: #1f5a31; }
.pil.nee { background: var(--zwart); color: #fff; }
.pil.st-nieuw { background: #dfe9f7; color: #1f4473; }
.pil.st-benaderen { background: #fcebc9; color: #6b4a00; }
.pil.st-wacht-op-reactie { background: #ece5f6; color: #4a3770; }
.pil.st-afspraak-gepland { background: #dcefe1; color: #1f5a31; }
.pil.st-afgerond { background: #e3ece6; color: #3c5a45; }
.pil.st-geannuleerd { background: #eeeae6; color: #6b625b; text-decoration: line-through; }
.pil.st-geen-interesse { background: var(--zwart); color: #fff; }
.pil.voorstel { background: #fdf0c7; color: #6b4a00; }
.pil.actief-ja { background: #dcefe1; color: #1f5a31; }
.pil.actief-nee { background: #eeeae6; color: #6b625b; }
.pil.actief-onzeker { background: #fcebc9; color: #6b4a00; }
.tag { display: inline-block; font-size: .78rem; padding: 0 7px; border-radius: 6px; background: var(--accent-zacht); color: var(--accent-donker); margin: 1px 3px 1px 0; }
.dagen { font-size: .8rem; color: var(--zacht); margin-left: 4px; }

/* ---------- dialogen ---------- */
dialog { border: 0; padding: 0; border-radius: 16px; box-shadow: 0 20px 60px rgba(40, 25, 15, .25); color: var(--tekst); background: var(--kaart); }
dialog::backdrop { background: rgba(47, 41, 37, .38); }
.dialoog { width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
.dialoog-form { display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.dialoog-form > header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--lijn); }
.dialoog-form > header h2 { flex: 1; }
.sluit { border: 0; background: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--zacht); padding: 2px 8px; border-radius: 8px; }
.sluit:hover { background: var(--accent-zacht); }
.dialoog-inhoud { padding: 16px 20px; overflow: auto; }
.dialoog-form > footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 12px 20px 16px; border-top: 1px solid var(--lijn); }
.dialoog-form > footer .links { margin-right: auto; }

.lade { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(760px, 100vw); border-radius: 16px 0 0 16px; }
.lade .dialoog-form { height: 100vh; max-height: 100vh; }

.velden { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.veld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.veld.breed { grid-column: 1 / -1; }
.veld-label { font-size: .875rem; font-weight: 600; color: #4d433c; }
.veld-label .opt { font-weight: 400; color: var(--zacht); }
.veld input, .veld select, .veld textarea { width: 100%; }
.veld textarea { min-height: 76px; resize: vertical; }
.hulp { color: var(--zacht); font-size: .82rem; }
.berekend-blok { background: var(--berekend); border-radius: 10px; padding: 10px 14px; }
.berekend-blok .kopje { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--zacht); font-weight: 700; }
.vinkjes { display: flex; flex-wrap: wrap; gap: 6px; }
.vinkjes label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--lijn); border-radius: 999px; cursor: pointer; background: var(--invoer); font-size: .925rem; }
.vinkjes label:has(input:checked) { background: var(--accent-zacht); border-color: var(--accent); }
.snelle-datums { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.match { border: 1px solid var(--lijn); border-radius: 10px; padding: 10px 12px; margin-top: 12px; background: #fcf9f6; }
.match h3 { font-size: .95rem; margin-bottom: 6px; }
.match label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 4px; cursor: pointer; border-top: 1px dashed var(--lijn); }
.match label:first-of-type { border-top: 0; }
.niveau { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-radius: 6px; padding: 0 6px; }
.niveau.zeker { background: #dcefe1; color: #1f5a31; }
.niveau.waarschijnlijk { background: #e5eef9; color: #1f4473; }
.niveau.mogelijk { background: #fcebc9; color: #6b4a00; }
.kiezer { position: relative; }
.kiezer input { width: 100%; }
.kiezer-lijst { margin-top: 4px; border: 1px solid var(--lijn); border-radius: 10px; overflow: hidden; }
.kiezer-lijst:empty { display: none; }
.kiezer-optie { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--lijn); background: var(--kaart); cursor: pointer; }
.kiezer-optie:last-child { border-bottom: 0; }
.kiezer-optie:hover { background: var(--accent-zacht); }
.gekozen { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 12px; background: var(--accent-zacht); border-radius: 10px; }

.sectie { margin-top: 22px; }
.sectie > h3 { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.sectie > h3 .knop { margin-left: auto; }
.tijdlijn { list-style: none; margin: 0; padding: 0; }
.tijdlijn li { display: grid; grid-template-columns: 104px 1fr auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--lijn); }
.tijdlijn .wanneer { font-size: .875rem; color: var(--zacht); font-variant-numeric: tabular-nums; }
.tijdlijn .soort { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.soort.contact { color: var(--ok); }
.soort.poging { color: #8a6a00; }
.soort.afspraak { color: #1f4473; }
.soort.briefje { color: var(--accent-donker); }
.tijdlijn .tekst { white-space: pre-wrap; }
.excel-blok { font-size: .875rem; background: #faf7f3; border: 1px dashed var(--lijn); border-radius: 10px; padding: 10px 12px; }
.excel-blok dt { font-weight: 600; color: var(--zacht); }
.excel-blok dd { margin: 0 0 6px; white-space: pre-wrap; }
.waarschuwing { color: #8a5a00; font-size: .875rem; }
.persoonkop { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.persoonkop .knoppenrij { margin-left: auto; }

.melding {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s;
  background: var(--tekst); color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 100; pointer-events: none;
  box-shadow: var(--schaduw); max-width: calc(100vw - 32px);
}
.melding.zichtbaar { opacity: 1; transform: translateX(-50%) translateY(0); }

.controle-item { display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--lijn); align-items: flex-start; }
.controle-item.opgelost { opacity: .55; }
.controle-item p { margin: 0 0 6px; }
.uitleg-tekst { max-width: 760px; }
.uitleg-tekst li { margin-bottom: 6px; }
.legenda { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; align-items: center; }

/* ---------- smal scherm ---------- */
@media (max-width: 720px) {
  .kop-binnen { padding: 10px 16px 0; }
  main { padding: 16px 16px 80px; }
  .snelknoppen { margin-left: 0; width: 100%; }
  .snelknoppen .knop { flex: 1 1 calc(50% - 8px); justify-content: center; }
  .raster { grid-template-columns: 1fr; }
  .velden { grid-template-columns: 1fr; }
  .lade { border-radius: 0; }
  .item { flex-wrap: wrap; }
  .item .knoppenrij { width: 100%; justify-content: flex-start; }
  .tijdlijn li { grid-template-columns: 1fr auto; }
  .tijdlijn .wanneer { grid-column: 1 / -1; }
  table.kaartjes thead { display: none; }
  table.kaartjes, table.kaartjes tbody, table.kaartjes tr, table.kaartjes td { display: block; width: 100%; }
  table.kaartjes tr { padding: 10px 12px; border-bottom: 1px solid var(--lijn); }
  table.kaartjes td { border: 0; padding: 2px 0; }
  table.kaartjes td:empty { display: none; }
  table.kaartjes td[data-label]::before { content: attr(data-label) ": "; color: var(--zacht); font-size: .82rem; }
}

/* events */
.event-kaart .event-body { padding: 0 16px 16px; }
.event-telling { margin-top: 6px; font-weight: 550; }
table.aanmeldlijst td { vertical-align: middle; }
table.aanmeldlijst .segment { padding: 2px; flex-wrap: nowrap; white-space: nowrap; }
table.aanmeldlijst .segment label span { padding: 3px 10px; font-size: .875rem; }
table.aanmeldlijst select, table.aanmeldlijst input[type=text] { min-width: 0; width: 100%; padding: 6px 9px; }
table.aanmeldlijst select { min-width: 150px; }
table.aanmeldlijst input[type=text] { min-width: 120px; }
table.aanmeldlijst td.acties { white-space: nowrap; text-align: right; }
table.aanmeldlijst td.acties .knop { margin-right: 6px; }
dialog.lade.event-lade { width: min(1040px, 100vw); }
.lade { max-width: 100vw; }
.aanmeld-optie { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.link.gevaar { color: #a33a2f; }
@media (max-width: 720px) {
  table.aanmeldlijst td.acties { text-align: left; padding-top: 6px; }
  table.aanmeldlijst select, table.aanmeldlijst input[type=text] { min-width: 0; }
}

/* ---------- mijn dag en actielijst ---------- */
.dagkaart { margin-bottom: 16px; }
.dagkaart > header { gap: 14px; flex-wrap: wrap; }
.dag-kop { flex: 1 1 180px; min-width: 0; }
.dag-kop h2 { font-size: 1.2rem; }
.dag-kop .regel2 { font-size: .9rem; color: var(--zacht); }
.reeks { color: var(--accent-donker); font-weight: 600; }
.ring { position: relative; width: 58px; height: 58px; flex: none; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring-baan { fill: none; stroke: var(--berekend); stroke-width: 7; }
.ring-vul { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .3s; }
.ring.vol .ring-vul { stroke: var(--ok); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; }

  // ------------------------------------------------------------ controlelijst
  function voegControleToe(soort, tekst, extra) {
    var c = { id: nieuwId('c'), soort: soort, tekst: tekst, opgelost: false, datum: vandaag() };
    Object.keys(extra || {}).forEach(function (k) { c[k] = extra[k]; });
    state.controle.push(c);
    return c;
  }

  // ------------------------------------------------------------ personen
  function maakPersoon(inv) {
    var p = {
      id: nieuwId('p'), naam: (inv.naam || '').trim(), naamVarianten: [], woonplaats: (inv.woonplaats || '').trim(),
      telefoon: (inv.telefoon || '').trim(), instagram: (inv.instagram || '').trim(), telefoonOpmerking: '', interesse: inv.interesse || 'onbekend',
      interesseOrigineel: '', onderwerpen: inv.onderwerpen || [], interesseToelichting: '', bron: inv.bron || 'Onbekend',
      bronDetail: inv.bronDetail || '', event: 'onbekend', eventDetail: '', contactOud: '', notities: inv.notities || '',
      volgendeActie: '', opvolgDatum: null, schatting: null, markering: [], bronRefs: [],
      aangemaakt: vandaag(), gewijzigd: vandaag()
    };
    state.personen.push(p);
    return p;
  }
  function wijzigPersoon(id, velden) {
    var p = persoon(id); if (!p) return null;
    Object.keys(velden).forEach(function (k) { p[k] = velden[k]; });
    p.gewijzigd = vandaag();
    return p;
  }

  /* Neemt alles van persoon b over in persoon a en verwijdert b. Notities en geschiedenis blijven bewaard. */
  function voegPersonenSamen(aId, bId) {
    var a = persoon(aId), b = persoon(bId);
    if (!a || !b || a === b) return null;
    namenVan(b).forEach(function (n) { if (namenVan(a).indexOf(n) < 0) a.naamVarianten.push(n); });
    ['woonplaats', 'telefoon', 'volgendeActie', 'opvolgDatum', 'interesseToelichting', 'eventDetail'].forEach(function (k) { if (!a[k] && b[k]) a[k] = b[k]; });
    if (a.telefoon && b.telefoon && telSleutel(a.telefoon) !== telSleutel(b.telefoon))
      a.telefoonOpmerking = (a.telefoonOpmerking ? a.telefoonOpmerking + ' | ' : '') + 'Ook bekend: ' + b.telefoon;
    if (a.interesse === 'onbekend') a.interesse = b.interesse;
    if (a.event !== 'ja' && b.event !== 'onbekend') a.event = b.event;
    if (a.bron === 'Onbekend') a.bron = b.bron;
    (b.onderwerpen || []).forEach(function (o) { if (a.onderwerpen.indexOf(o) < 0) a.onderwerpen.push(o); });
    if (b.notities) a.notities = a.notities ? a.notities + '\n' + b.notities : b.notities;
    if (b.bronDetail && a.bronDetail.indexOf(b.bronDetail) < 0) a.bronDetail = a.bronDetail ? a.bronDetail + ' | ' + b.bronDetail : b.bronDetail;
    a.markering = (a.markering || []).concat((b.markering || []).filter(function (m) { return a.markering.indexOf(m) < 0; }));
    a.bronRefs = (a.bronRefs || []).concat(b.bronRefs || []);
    if (!a.schatting && b.schatting) a.schatting = b.schatting;
    if (!a.instagram && b.instagram) a.instagram = b.instagram;
    ['contactmomenten', 'briefjes', 'afspraken', 'punten'].forEach(function (k) {
      state[k].forEach(function (x) { if (x.persoonId === b.id) x.persoonId = a.id; });
    });
    // staan beiden op dezelfde aanmeldlijst, dan blijft één regel over met de gegevens van beide
    state.aanmeldingen.filter(function (x) { return x.persoonId === b.id; }).forEach(function (x) {
      var dubbel = aanmeldingVan(x.eventId, a.id);
      if (!dubbel) { x.persoonId = a.id; return; }
      ['interesse', 'bevestigd', 'betaald'].forEach(function (k) { if (!dubbel[k] && x[k]) dubbel[k] = x[k]; });
      if (x.notitie) dubbel.notitie = dubbel.notitie ? dubbel.notitie + ' | ' + x.notitie : x.notitie;
      verwijder('aanmeldingen', x.id);
    });
    state.controle.forEach(function (c) {
      if (c.persoonId === b.id) c.persoonId = a.id;
      if (c.persoonIds) c.persoonIds = c.persoonIds.map(function (x) { return x === b.id ? a.id : x; });
    });
    verwijder('personen', b.id);
    a.gewijzigd = vandaag();
    return a;
  }

  function verwijder(lijst, id) {
    state[lijst] = state[lijst].filter(function (x) { return x.id !== id; });
    if (state.verwijderd.indexOf(id) < 0) state.verwijderd.push(id);
    state.verwijderdOp[id] = Date.now();
    if (lijst === 'personen') {
      state.punten.forEach(function (r) { if (r.persoonId === id) r.persoonId = null; });
      ['contactmomenten', 'briefjes', 'afspraken', 'aanmeldingen'].forEach(function (k) {
        state[k].filter(function (x) { return x.persoonId === id; }).forEach(function (x) { verwijder(k, x.id); });
      });
    }
    if (lijst === 'acties') {
      state.actielog.filter(function (x) { return x.actieId === id; }).forEach(function (x) { verwijder('actielog', x.id); });
    }
    if (lijst === 'events') {
      state.aanmeldingen.filter(function (x) { return x.eventId === id; }).forEach(function (x) { verwijder('aanmeldingen', x.id); });
    }
    if (lijst === 'locaties') {
      state.legingen.filter(function (g) { return g.locatieId === id; }).forEach(function (g) { verwijder('legingen', g.id); });
      state.briefjes.forEach(function (b) { if (b.locatieId === id) b.locatieId = null; });
    }
    if (lijst === 'briefjes') {
      state.afspraken.forEach(function (a) { if (a.briefjeId === id) a.briefjeId = null; });
      state.contactmomenten.forEach(function (m) { if (m.briefjeId === id) m.briefjeId = null; });
    }
  }

  // ------------------------------------------------------------ briefjes
  /* inv: {naam, woonplaats, telefoon, locatieId, winoptie, winactie, ingeleverdOp, notities}
     keuze: id van bestaande persoon, of 'nieuw'. Zonder keuze wordt standaardKeuze gebruikt. */
  function voegBriefjeToe(inv, keuze) {
    var matches = zoekOvereenkomsten(inv);
    if (!keuze) keuze = standaardKeuze(matches);
    var p, nieuw = false;
    if (keuze === 'nieuw') {
      p = maakPersoon({ naam: inv.naam, woonplaats: inv.woonplaats, telefoon: inv.telefoon, bron: 'Winactie', bronDetail: 'Winactie' });
      nieuw = true;
      var twijfel = matches.filter(function (m) { return m.persoon.id !== p.id; });
      if (twijfel.length) voegControleToe('Mogelijk dezelfde persoon',
        p.naam + ' is als nieuwe persoon aangemaakt, maar lijkt op: ' + twijfel.map(function (m) { return m.persoon.naam + ' (' + m.reden.toLowerCase() + ')'; }).join(', ') + '.',
        { persoonIds: [p.id].concat(twijfel.map(function (m) { return m.persoon.id; })) });
    } else {
      p = persoon(keuze);
      if (inv.naam && namenVan(p).map(normNaam).indexOf(normNaam(inv.naam)) < 0) p.naamVarianten.push(inv.naam.trim());
      if (inv.telefoon) {
        if (!p.telefoon) p.telefoon = inv.telefoon.trim();
        else if (telSleutel(p.telefoon) !== telSleutel(inv.telefoon)) {
          p.telefoonOpmerking = (p.telefoonOpmerking ? p.telefoonOpmerking + ' | ' : '') + 'Ander nummer op briefje: ' + inv.telefoon.trim();
          voegControleToe('Telefoon', p.naam + ': op een nieuw briefje staat ' + inv.telefoon.trim() + ', bekend was ' + p.telefoon + '.', { persoonId: p.id });
        }
      }
      if (!p.woonplaats && inv.woonplaats) p.woonplaats = inv.woonplaats.trim();
      p.gewijzigd = vandaag();
    }
    var b = {
      id: nieuwId('b'), persoonId: p.id, locatieId: inv.locatieId || null, locatieTekst: '', locatieZeker: !!inv.locatieId,
      winactie: inv.winactie || '', winoptie: inv.winoptie || '', ingeleverdOp: inv.ingeleverdOp || null,
      status: 'Nieuw', volgendeActie: 'Bellen of appen', volgendeActieDatum: null, notities: inv.notities || '',
      aangemaakt: vandaag(), origineel: {}
    };
    state.briefjes.push(b);
    return { briefje: b, persoon: p, nieuwePersoon: nieuw };
  }
  function briefjesVan(pid) { return state.briefjes.filter(function (b) { return b.persoonId === pid; }); }

  // ------------------------------------------------------------ contactmomenten
  /* inv: {persoonId, datum, soort:'contact'|'poging', kanaal, uitkomst, notitie, briefjeId, briefjeStatus,
          volgendeActie, opvolgDatum, geenInteresse} */
  function voegContactToe(inv) {
    var p = persoon(inv.persoonId); if (!p) throw new Error('Persoon onbekend');
    var m = { id: nieuwId('m'), persoonId: p.id, briefjeId: inv.briefjeId || null, datum: inv.datum || vandaag(),
      soort: inv.soort === 'poging' ? 'poging' : 'contact', kanaal: inv.kanaal || 'Onbekend', uitkomst: inv.uitkomst || '',
      notitie: inv.notitie || '' };
    state.contactmomenten.push(m);
    if (inv.volgendeActie !== undefined) p.volgendeActie = inv.volgendeActie;
    if (inv.opvolgDatum !== undefined) p.opvolgDatum = inv.opvolgDatum || null;
    if (inv.geenInteresse) p.interesse = 'nee';
    if (m.soort === 'contact') p.schatting = null;
    if (m.briefjeId) {
      var b = vind('briefjes', m.briefjeId);
      if (b) {
        if (inv.briefjeStatus) b.status = inv.briefjeStatus;
        else if (inv.geenInteresse) b.status = 'Geen interesse';
        else if (OPEN_STATUS.indexOf(b.status) >= 0) b.status = 'Wacht op reactie';
        if (b.volgendeActie === 'Bellen of appen') b.volgendeActie = '';
      }
    }
    p.gewijzigd = vandaag();
    return m;
  }
  function momentenVan(pid) {
    return state.contactmomenten.filter(function (m) { return m.persoonId === pid; })
      .sort(function (a, b) { return (b.datum || '').localeCompare(a.datum || ''); });
  }
  function laatsteContact(pid) {
    var d = null;
    state.contactmomenten.forEach(function (m) { if (m.persoonId === pid && m.soort === 'contact' && m.datum && (!d || m.datum > d)) d = m.datum; });
    return d;
  }
  function laatstePoging(pid) {
    var d = null;
    state.contactmomenten.forEach(function (m) { if (m.persoonId === pid && m.datum && (!d || m.datum > d.datum)) d = m; });
    return d;
  }

  // ------------------------------------------------------------ contactkleur
  function kleurVoorDatum(datum, vd) {
    var dagen = dagenTussen(datum, vd);
    if (datum <= plusMaanden(vd, -6)) return 'rood';
    if (datum <= plusMaanden(vd, -3)) return 'oranje';
    if (datum <= plusMaanden(vd, -1)) return 'geel';
    if (dagen >= 14) return 'groen';
    return 'recent';
  }
  function kleurInfo(code) { for (var i = 0; i < KLEUREN.length; i++) if (KLEUREN[i].code === code) return KLEUREN[i]; return null; }

  /* Geeft {code, label, datum, dagen, schatting, uitleg}. */
  function contactStatus(p, vd) {
    vd = vd || vandaag();
    if (p.interesse === 'nee') return { code: 'zwart', label: 'Geen interesse', uitleg: 'Interesse staat op Nee.' };
    var d = laatsteContact(p.id);
    if (d) {
      var code = kleurVoorDatum(d, vd), dagen = dagenTussen(d, vd);
      return { code: code, label: kleurInfo(code).label, datum: d, dagen: dagen,
        uitleg: 'Laatste echte contact: ' + nlDatum(d) + ' (' + (dagen === 0 ? 'vandaag' : dagen === 1 ? 'gisteren' : dagen + ' dagen geleden') + ').' };
    }
    if (p.schatting && SCHATTINGEN[p.schatting.periode]) {
      var s = SCHATTINGEN[p.schatting.periode];
      var ongeveer = s.dagen ? plusDagen(p.schatting.op, -s.dagen) : plusMaanden(p.schatting.op, -s.maanden);
      var c = kleurVoorDatum(ongeveer, vd);
      return { code: c, label: kleurInfo(c).label, schatting: true,
        uitleg: 'Schatting: op ' + nlDatum(p.schatting.op) + ' ingevuld als "' + s.label + '". Geen exacte datum; leg een contactmoment vast zodra je haar of hem spreekt.' };
    }
    return { code: 'onbekend', label: 'Onbekend', uitleg: 'Geen datum van echt contact bekend.' };
  }

  // ------------------------------------------------------------ afspraken
  function voegAfspraakToe(inv) {
    var a = { id: nieuwId('a'), persoonId: inv.persoonId, briefjeId: inv.briefjeId || null, gemaaktOp: inv.gemaaktOp || vandaag(),
      datum: inv.datum || null, tijd: inv.tijd || '', locatie: inv.locatie || '', onderwerp: inv.onderwerp || '',
      status: 'gepland', bevestigingOp: inv.bevestigingVerstuurd ? vandaag() : null, herinneringOp: null, berichtNaOp: null, berichtNa: '',
      notitie: inv.notitie || '' };
    state.afspraken.push(a);
    if (a.briefjeId) { var b = vind('briefjes', a.briefjeId); if (b) { b.status = 'Afspraak gepland'; b.volgendeActie = ''; } }
    return a;
  }
  function zetAfspraakStatus(id, status) {
    var a = vind('afspraken', id); if (!a) return null;
    a.status = status;
    var b = a.briefjeId ? vind('briefjes', a.briefjeId) : null;
    if (status === 'afgerond') {
      var bestaat = state.contactmomenten.some(function (m) { return m.afspraakId === a.id; });
      if (!bestaat) {
        var m = voegContactToe({ persoonId: a.persoonId, briefjeId: a.briefjeId, datum: a.datum && a.datum <= vandaag() ? a.datum : vandaag(),
          soort: 'contact', kanaal: 'Afspraak', uitkomst: 'Afspraak gehad', notitie: a.onderwerp || '', briefjeStatus: 'Afgerond' });
        m.afspraakId = a.id;
      }
      if (b) b.status = 'Afgerond';
    } else if (status === 'geannuleerd' && b) b.status = 'Geannuleerd';
    else if (status === 'gepland' && b) b.status = 'Afspraak gepland';
    return a;
  }
  function markeerVerstuurd(id, veld) {
    var a = vind('afspraken', id); if (!a) return null;
    a[veld] = vandaag();
    return a;
  }
  function afsprakenVan(pid) { return state.afspraken.filter(function (a) { return a.persoonId === pid; }); }

  // ------------------------------------------------------------ locaties en legingen
  function voegLegingToe(inv) {
    var g = { id: nieuwId('g'), locatieId: inv.locatieId, datum: inv.datum || vandaag(), maand: (inv.datum || vandaag()).slice(0, 7),
      datumTekst: '', uitkomst: inv.uitkomst === 'niet_geleegd' ? 'niet_geleegd' : 'geleegd',
      aantal: inv.uitkomst === 'niet_geleegd' || inv.aantal === '' || inv.aantal === null || inv.aantal === undefined ? null : Math.max(0, parseInt(inv.aantal, 10) || 0),
      opmerking: inv.opmerking || '' };
    state.legingen.push(g);
    var l = vind('locaties', g.locatieId);
    if (l && l.volgendeControle && l.volgendeControle <= g.datum) l.volgendeControle = null;
    return g;
  }
  function legingDatum(g) { return g.datum || (g.maand ? plusDagen(plusMaanden(g.maand + '-01', 1), -1) : null); }
  function legingenVan(lid) {
    return state.legingen.filter(function (g) { return g.locatieId === lid; })
      .sort(function (a, b) { return (legingDatum(b) || '').localeCompare(legingDatum(a) || ''); });
  }
  function laatsteLeging(lid) {
    var l = legingenVan(lid).filter(function (g) { return g.uitkomst === 'geleegd'; });
    return l[0] || null;
  }
  function volgendeControle(loc) {
    if (loc.volgendeControle) return { datum: loc.volgendeControle, handmatig: true };
    var g = laatsteLeging(loc.id);
    var basis = g ? legingDatum(g) : loc.eerstePlaatsing;
    if (!basis || !loc.frequentie) return null;
    return { datum: loc.frequentie === 'week' ? plusDagen(basis, 7) : plusMaanden(basis, 1), handmatig: false };
  }

  /* Overzicht per locatie en maand voor één jaar. Cel: {som, onbekend, nietGeleegd, nul, aantalLegingen}. */
  function legingOverzicht(jaar) {
    var rijen = {}, kolomTotaal = [], onbekendInKolom = [];
    for (var i = 0; i < 12; i++) { kolomTotaal.push(0); onbekendInKolom.push(false); }
    state.legingen.forEach(function (g) {
      if (!g.maand || g.maand.slice(0, 4) !== String(jaar)) return;
      var m = +g.maand.slice(5, 7) - 1;
      var r = rijen[g.locatieId] || (rijen[g.locatieId] = { locatieId: g.locatieId, cellen: [], totaal: 0, onbekend: false });
      var c = r.cellen[m] || (r.cellen[m] = { som: 0, onbekend: 0, nietGeleegd: 0, geleegd: 0 });
      if (g.uitkomst === 'niet_geleegd') { c.nietGeleegd++; return; }
      c.geleegd++;
      if (g.aantal === null || g.aantal === undefined) { c.onbekend++; r.onbekend = true; onbekendInKolom[m] = true; return; }
      c.som += g.aantal; r.totaal += g.aantal; kolomTotaal[m] += g.aantal;
    });
    var lijst = Object.keys(rijen).map(function (k) { return rijen[k]; });
    lijst.sort(function (a, b) { var la = vind('locaties', a.locatieId), lb = vind('locaties', b.locatieId); return ((la && la.naam) || '').localeCompare((lb && lb.naam) || ''); });
    var totaal = kolomTotaal.reduce(function (s, x) { return s + x; }, 0);
    return { jaar: jaar, rijen: lijst, kolomTotaal: kolomTotaal, onbekendInKolom: onbekendInKolom, totaal: totaal };
  }
  function legingJaren() {
    var j = {}; j[vandaag().slice(0, 4)] = 1;
    state.legingen.forEach(function (g) { if (g.maand) j[g.maand.slice(0, 4)] = 1; });
    return Object.keys(j).map(Number).sort();
  }
  function tellingen() {
    var verzameld = 0, onbekend = 0;
    state.legingen.forEach(function (g) { if (g.uitkomst === 'geleegd') { if (g.aantal === null || g.aantal === undefined) onbekend++; else verzameld += g.aantal; } });
    var uniek = {}; state.briefjes.forEach(function (b) { uniek[b.persoonId] = 1; });
    return { verzameld: verzameld, legingenZonderAantal: onbekend, ingevoerd: state.briefjes.length, deelnemers: Object.keys(uniek).length };
  }

  // ------------------------------------------------------------ vandaag en binnenkort
  function overzichtVandaag(vd) {
    vd = vd || vandaag();
    var over7 = plusDagen(vd, 7), over14 = plusDagen(vd, 14);
    var benaderen = [], wachten = [], opvolging = [], komend = [], voorbij = [], herinneren = [], boxjes = [];
    state.briefjes.forEach(function (b) {
      var p = persoon(b.persoonId); if (!p) return;
      if (p.interesse === 'nee' && b.status !== 'Afspraak gepland') return;
      if (OPEN_STATUS.indexOf(b.status) >= 0) benaderen.push({ briefje: b, persoon: p });
      else if (b.status === 'Wacht op reactie') {
        var lp = laatstePoging(p.id);
        wachten.push({ briefje: b, persoon: p, sinds: lp ? lp.datum : null });
      }
      if (b.volgendeActieDatum && b.volgendeActieDatum <= over7 && ['Afgerond', 'Geannuleerd', 'Geen interesse'].indexOf(b.status) < 0)
        opvolging.push({ persoon: p, briefje: b, datum: b.volgendeActieDatum, actie: b.volgendeActie, teLaat: b.volgendeActieDatum < vd });
    });
    state.personen.forEach(function (p) {
      if (p.interesse === 'nee' || !p.opvolgDatum || p.opvolgDatum > over7) return;
      opvolging.push({ persoon: p, datum: p.opvolgDatum, actie: p.volgendeActie, teLaat: p.opvolgDatum < vd });
    });
    state.afspraken.forEach(function (a) {
      var p = persoon(a.persoonId); if (!p || a.status !== 'gepland') return;
      var item = { afspraak: a, persoon: p };
      if (!a.datum || a.datum < vd) voorbij.push(item);
      else {
        if (a.datum <= over14) komend.push(item);
        if (!a.herinneringOp) herinneren.push(item);
      }
    });
    state.locaties.forEach(function (l) {
      if (l.actief !== 'ja') return;
      var v = volgendeControle(l);
      if (v && v.datum <= plusDagen(vd, 2)) boxjes.push({ locatie: l, datum: v.datum, teLaat: v.datum < vd });
    });
    var opDatum = function (k) { return function (a, b) { return (k(a) || '9999').localeCompare(k(b) || '9999'); }; };
    wachten.sort(opDatum(function (x) { return x.sinds; }));
    opvolging.sort(opDatum(function (x) { return x.datum; }));
    komend.sort(opDatum(function (x) { return x.afspraak.datum + (x.afspraak.tijd || ''); }));
    voorbij.sort(opDatum(function (x) { return x.afspraak.datum; }));
    herinneren.sort(opDatum(function (x) { return x.afspraak.datum; }));
    boxjes.sort(opDatum(function (x) { return x.datum; }));
    return { benaderen: benaderen, wachten: wachten, opvolging: opvolging, komend: komend, voorbij: voorbij,
      herinneren: herinneren, boxjes: boxjes, controle: state.controle.filter(function (c) { return !c.opgelost; }).length };
  }

  // ------------------------------------------------------------ events en aanmeldlijsten
  /* event: {id, naam, datum, tijd, locatie, onderwerp, prijs, omschrijving, notities}
     aanmelding: {id, eventId, persoonId, interesse '', 'ja', 'nee'; bevestigd '', 'ja', 'nee'; betaald '', cash, betaalverzoek, gratis; notitie} */
  function voegEventToe(inv) {
    var e = { id: nieuwId('e'), naam: (inv.naam || '').trim(), datum: inv.datum || null, tijd: inv.tijd || '', locatie: inv.locatie || '',
      onderwerp: inv.onderwerp || '', prijs: inv.prijs || '', omschrijving: inv.omschrijving || '', notities: inv.notities || '', aangemaakt: vandaag() };
    state.events.push(e);
    return e;
  }
  function aanmeldingVan(eventId, pid) {
    for (var i = 0; i < state.aanmeldingen.length; i++) { var x = state.aanmeldingen[i]; if (x.eventId === eventId && x.persoonId === pid) return x; }

      bewaar(true); teken();
      alert('Samengevoegd.\n\n' + uit.nieuw + ' nieuw\n' + uit.bijgewerkt + ' bijgewerkt\n' + uit.verwijderd + ' verwijderd\n\nMaak nu hier een back-up en zet die op het andere apparaat terug (of voeg hem daar samen). Dan zijn beide weer gelijk.');
    };
    r.readAsText(bestand);
  }

  // ------------------------------------------------------------ start
  window.addEventListener('storage', function (e) {
    if (e.key !== C.OPSLAG_SLEUTEL || !e.newValue) return;
    try { C.zet(JSON.parse(e.newValue)); } catch (x) { return; }
    document.querySelectorAll('dialog').forEach(function (d) { d.close(); });
    teken(); melding('Bijgewerkt vanuit een ander venster');
  });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  bouwRaamwerk();
  teken();
  // synchroniseren bij het openen, bij terugkomst in de app, zodra er weer internet is en verder elke minuut
  sync.plan(400);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync.plan(0); });
  window.addEventListener('online', function () { sync.plan(0); });
  setInterval(function () { if (!document.hidden) sync.plan(0); }, 60000);
  window.__app = { teken: teken, openPersoon: openPersoon, openEvent: openEvent, naarTab: function (t) { w.tab = t; teken(); }, sync: sync };
})();
</script>
